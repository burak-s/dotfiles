# ~/.config/tmux/tmux.conf
# Sade tutuldu: eklenti yok, sadece günlük işi kolaylaştıran satırlar.

# --- prefix: C-a (C-b yerine)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Mouse support
set -g mouse on

# --- Türkçe klavye dostu bölme tuşları ('%' Shift+5 olduğu için harf)
bind v split-window -h -c "#{pane_current_path}"   # yan yana
bind - split-window -v -c "#{pane_current_path}"   # alt alta (delete-buffer'ı ezer)
# NOT: s artık tmux varsayılanı gibi OTURUM LİSTESİ. Bölmeye vermiştim, geri alındı.

# --- yeni oturum: C-a t (t = proje/tab). '%%' = yazdigin isim
bind t command-prompt -p "yeni oturum adi:" { new-session -s '%%' -c "#{pane_current_path}" }

# --- isim degistirme:
#   C-a ,  pencere adi (tmux varsayilani, kolay tus)
#   C-a m  oturum adi  (varsayilan '$' Shift+4 oldugu icin zor; m'ye aldim)
bind m command-prompt -I "#S" { rename-session '%%' }

# Windows 1'den başlar.
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on

# --- pi'ın istediği ayarlar: Shift/Ctrl+Enter gibi değiştirilmiş tuşlar
set -g extended-keys on
set -g extended-keys-format csi-u

# --- nvim: pencereye odaklanınca diskteki değişiklikleri anında yükler
set -g focus-events on

# --- Esc'i nvim'e gecikmesiz iletir (varsayılan 500ms)
set -sg escape-time 0

# --- pane gezinme (vim gibi): h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- copy mode'da vim tuşları
setw -g mode-keys vi

# --- sağ altta aktif pane'in çalışma dizini
set -g status-right '#{b:pane_current_path}'

# --- pencere adı otomatik (elle C-a , ile isimlendirmeye gerek yok):
#     shell çalışıyorsa klasör adı, başka komut/servis çalışıyorsa o komutun adı
setw -g automatic-rename on
set  -g allow-rename off
setw -g automatic-rename-format '#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'

# Yeni pencerede mevcut dizini koru
bind c new-window -c "#{pane_current_path}"

# --- kopyalama / pano -----------------------------------------------------
# Copy mode'a giris: tmux varsayilani 'C-a [' ama Turkce Q klavyede '[' AltGr+8,
# yani zor. Esc tek tus oldugu icin ona aliyoruz: C-a Esc
bind Escape copy-mode

# Copy mode icinde 'y' = yank (vim aliskanligi). tmux varsayilaninda sadece
# Enter ve C-j kopyaliyor; 'y' bos. vi modunda oldugumuz icin (mode-keys vi)
# y'yi de kopyala-ve-cikis yaptik.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Copy mode'da kopyaladigin metin SISTEM panosuna gitsin (OSC52 -> wl-copy).
# 'external' (varsayilan) sadece uygulamalarin panosunu kabul eder; tmux'un
# kendi yank'i panoya gitmez. 'on' ikisini de yapar. wl-clipboard kurulu.
set -g set-clipboard on

# Scrollback gecmisi: varsayilan 2000 satir. 'go test' / log ciktisi bunu
# saniyeler icinde doldurur, yukari kaydirinca kaybolmasin diye 50000.
set -g history-limit 50000

# --- config'i yeniden yükle: C-a r
bind r if-shell 'test -r "$HOME/.config/tmux/tmux.conf"' 'source-file ~/.config/tmux/tmux.conf' 'source-file /etc/tmux.conf' \; display "tmux.conf yeniden yuklendi"

# --- pi popup: C-a a ------------------------------------------------------
# pi'yi bu pane'in dizininde YUZEN pencerede acar; kapattiginda pane'in aynen kalir.
# -E  = komut bitince popup kapanir      -xC -yC = ortala
bind a display-popup -d "#{pane_current_path}" -xC -yC -w 92% -h 88% -E pi
